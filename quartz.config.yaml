# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Пісня туманів
  pageTitleSuffix: " | Пісня туманів"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: uk-UA
  baseUrl: pisnia-tumaniv.pages.dev
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Exo 2
      body: Inter
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#f5f5f0"
        lightgray: "#e3e3dc"
        gray: "#888880"
        darkgray: "#40403a"
        dark: "#1a1a18"
        secondary: "#2e5c55"
        tertiary: "#a63d40"
        highlight: rgba(46, 92, 85, 0.15)
        textHighlight: "#d4c8be"
      darkMode:
        light: "#0b0c10"
        lightgray: "#1f2833"
        gray: "#45a29e"
        darkgray: "#c5c6c7"
        dark: "#e3e4e6"
        secondary: "#66fcf1"
        tertiary: "#ff4d4d"
        highlight: rgba(102, 252, 241, 0.15)
        textHighlight: "#66fcf144"
  fonts:
    # Зберігаємо резервні шрифти заголовків із базових стилів Quartz.
    enabled: false
  links:
    markdownLinkResolution: shortest
  contentIndex:
    enableSiteMap: true
    enableRSS: true

plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority: [frontmatter, git, filesystem]
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 30
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      preset: strict
      strictLineBreaks: true
      enableInHtmlEmbed: false
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      display: desktop-only
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/spacer"
    enabled: true
    layout:
      position: left
      priority: 20
      display: mobile-only
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 10
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      title: Навігація
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    options:
      rootName: Головна
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/undead404/pisnia-tumaniv
        Пісня туманів на YouTube: https://www.youtube.com/playlist?list=PL2zoJ5Mco28pMShErqXngbEWYwr65IDCb
    layout:
      position: footer

layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    folder:
      exclude: [reader-mode, tag-list]
      positions:
        right: []
    tag:
      exclude: [reader-mode, tag-list]
      positions:
        right: []
